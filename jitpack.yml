# JitPack build config for Flash.
# JitPack's default JDK is too old for AGP 9.3.1 — pin JDK 17 (the AGP floor).
# Android SDK + ANDROID_HOME are provided by JitPack; no signing / no publish repo needed.
#
# Publish ONLY the supported v1 module set. core:engine api-depends on every other
# core module (including core-messaging), so all eight must land in ~/.m2 or a
# consumer of core-engine will fail to resolve a transitive dependency.
# -x test -x lint keeps builds fast and avoids test-only deps (bouncycastle,
# robolectric) failing the publish.
jdk:
  - openjdk17
install:
  - ./gradlew :core:common:publishToMavenLocal :core:security:publishToMavenLocal :core:discovery:publishToMavenLocal :core:network:publishToMavenLocal :core:transfer:publishToMavenLocal :core:persistence:publishToMavenLocal :core:messaging:publishToMavenLocal :core:engine:publishToMavenLocal -x test -x lint
